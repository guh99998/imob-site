[project]
name = "imob-site"
version = "0.1.0"
description = "Site de imobiliária (venda e aluguel)"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-environ",
    "pillow",
    "django-filter",
    "django-htmx",
    "django-tailwind-cli",
    "whitenoise",
    "psycopg[binary]",
    "gunicorn",
    "django-storages[s3]",
    "django-unfold>=0.110.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "ruff",
    "django-debug-toolbar",
    "playwright>=1.64.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "imob_site.settings.dev"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"apps/crm/base_templates.py" = ["E501"]  # texto dos modelos de documento
